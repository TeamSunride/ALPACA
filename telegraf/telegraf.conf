[agent]
    interval = "1s"
    flush_interval = "1s"


[[inputs.socket_listener]]
    service_address = "tcp://0.0.0.0:8094"
    data_format = "influx"

# [[inputs.mqtt_consumer]]
#     servers = ["tcp://172.30.0.1:1883"]
#     username = "sunride"
#     password = "launchbox"
#     topics = ["test/#"]
#     data_format = "influx"
#     data_type = "int"
#     name_override = "position"


[[processors.scale]]
    [[processors.scale.scaling]]
        input_minimum = 2.0
        input_maximum = 10.0
        output_minimum = 0.0
        output_maximum = 100.0
        fields = ["AIN0"]

[[processors.rename]]
    [[processors.rename.replace]]
        field = "AIN0"
        dest = "TANK_PRESSURE"

[[aggregators.final]]
    period = "1s"
    drop_original = true
    output_strategy = "periodic"
    
[[outputs.influxdb_v2]]
    urls = ["http://influxdb:8086"]
    token = "${INFLUX_TOKEN}"
    organization = "sunride"
    bucket = "telegraf"

