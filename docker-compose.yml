services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=sunride
      - DOCKER_INFLUXDB_INIT_PASSWORD=${PASS}
      - DOCKER_INFLUXDB_INIT_ORG=sunride
      - DOCKER_INFLUXDB_INIT_BUCKET=telegraf
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
      - INFLUXD_HTTP_BIND_ADDRESS=:8086
      - INFLUXD_STORAGE_WAL_FSYNC_DELAY=0s
      - INFLUXD_FLUX_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  telegraf:
    image: telegraf:1.37
    container_name: telegraf
    depends_on:
      influxdb:
        condition: service_healthy
      grafana:
        condition: service_started
    ports:
      - "8094:8094"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}

  grafana:
    image: grafana/grafana:13.0.0-22696220628-ubuntu
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=live
      - GF_SECURITY_ADMIN_USER=sunride
      - GF_SECURITY_ADMIN_PASSWORD=${PASS}
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    ports:
      - "1883:1883" #default mqtt port
      - "9001:9001" #default mqtt port for websockets
    volumes:
      - ./mqtt/config:/mosquitto/config:rw
      - ./mqtt/data:/mosquitto/data:rw
      - ./mqtt/log:/mosquitto/log:rw
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:


